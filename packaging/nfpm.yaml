# nfpm packaging (deb/rpm). Build: make package
name: hcdn-connector
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Hostinger CDN team <cdn@hostinger.com>
description: |
  Hostinger CDN tunnel connector. Exposes a private HTTP service to Hostinger
  CDN through outbound mTLS sessions; no inbound port is needed.
vendor: Hostinger
homepage: https://github.com/hostinger/hcdn-connector
license: Apache-2.0
depends:
  - systemd
contents:
  - src: ./dist/hcdn-connector
    dst: /usr/bin/hcdn-connector
    file_info:
      mode: 0755
  - src: ./packaging/hcdn-connector.service
    dst: /lib/systemd/system/hcdn-connector.service
    file_info:
      mode: 0644
  - src: ./packaging/config.example.yml
    dst: /etc/hcdn-connector/config.yml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: hcdn-connector
  - src: ./packaging/config.example.yml
    dst: /usr/share/doc/hcdn-connector/config.example.yml
    file_info:
      mode: 0644
  - src: ./LICENSE
    dst: /usr/share/doc/hcdn-connector/LICENSE
    file_info:
      mode: 0644
  - src: ./NOTICE
    dst: /usr/share/doc/hcdn-connector/NOTICE
    file_info:
      mode: 0644
  - dst: /etc/hcdn-connector
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: hcdn-connector
scripts:
  preinstall: ./packaging/scripts/preinstall.sh
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh
