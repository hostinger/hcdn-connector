name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Tool versions are pinned here, in release.yml and in the Makefile; bump them together.
# GO_VERSION equals the toolchain line of go.mod; lint checks it.
env:
  GO_VERSION: "1.27.4"
  STATICCHECK_VERSION: v0.8.2
  GOVULNCHECK_VERSION: v1.9.0
  NFPM_VERSION: v2.47.0
  GO_LICENSES_VERSION: v2.0.1
  GORELEASE_VERSION: v0.0.0-20261005173118-76772065c9b0
  TARGETS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: GO_VERSION matches the go.mod toolchain line
        run: |
          grep -qx "toolchain go${GO_VERSION}" go.mod || { echo "GO_VERSION ${GO_VERSION} != $(grep '^toolchain' go.mod)"; exit 1; }
          grep -q "GO_VERSION: \"${GO_VERSION}\"" .github/workflows/release.yml || { echo "release.yml GO_VERSION differs"; exit 1; }
          grep -q "^FROM golang:${GO_VERSION}-" packaging/Dockerfile || { echo "packaging/Dockerfile golang tag differs"; exit 1; }
          go version | grep -q "go${GO_VERSION} "
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...
      - name: licenses
        run: go run github.com/google/go-licenses/v2@${GO_LICENSES_VERSION} check ./... --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,MIT

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test -race
        # -race needs cgo; the hosted runners have a C compiler.
        if: matrix.os != 'windows-11-arm'
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: go test (windows/arm64 has no race detector)
        if: matrix.os == 'windows-11-arm'
        run: go test -count=1 ./...
      - name: h2srv with the http2legacy tag (a consumer can set it)
        if: runner.os == 'Linux'
        run: go test -tags http2legacy -count=1 ./internal/h2srv/

  # The go line in go.mod: a consumer on its exact version must build without a toolchain switch.
  goline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # go-version-file would pick the toolchain line (setup-go v6+), so pass the go line explicitly.
      - name: go line of go.mod
        id: goline
        run: echo "version=$(sed -n 's/^go //p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.goline.outputs.version }}
          cache: false
      - name: build and vet with the go.mod go line
        env:
          GOTOOLCHAIN: local
        run: |
          want="go$(sed -n 's/^go //p' go.mod)"
          go version | grep -q "${want} " || { echo "want ${want}, got $(go version)"; exit 1; }
          go build ./... && go vet ./...

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build every target (CGO_ENABLED=0)
        run: |
          for t in ${TARGETS}; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build ./...
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go vet ./...
          done

  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build examples/embed (separate module) for every target
        working-directory: examples/embed
        run: |
          for t in ${TARGETS}; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null .
          done
      - name: gorelease (API diff of pkg/...)
        run: |
          base=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$base" ]; then echo "no tag yet"; exit 0; fi
          go run golang.org/x/exp/cmd/gorelease@${GORELEASE_VERSION} -base="$base"

  package:
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build
        run: make build GOARCH=${{ matrix.goarch }} VERSION=0.1.0-ci
      - name: nfpm package (dry run)
        run: make package GOARCH=${{ matrix.goarch }} VERSION=0.1.0-ci NFPM_VERSION=${NFPM_VERSION}
      - name: unit file sanity
        run: grep -q 'RestartPreventExitStatus=78' packaging/hcdn-connector.service
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.goarch }}
          path: dist/
          retention-days: 7
