# Release skeleton: Linux deb/rpm/tar.gz, macOS tar.gz and Windows zip for
# amd64 and arm64, SBOM (syft), keyless cosign signatures, GitHub release.
# Not yet enabled end to end:
#   - cosign keyless needs `id-token: write` (below) and the repo's OIDC trust;
#     a key-based flow instead needs secrets COSIGN_PRIVATE_KEY / COSIGN_PASSWORD.
#   - the container image push needs a registry secret (REGISTRY_TOKEN) and the
#     image name agreed with the CDN team.
# Actions are pinned by commit SHA: this workflow can write releases and sign as the repo.
# Third-party build tools run in the read-only `build` job; only `release` holds write + OIDC.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4" # equals the go.mod toolchain line; ci.yml checks it
  STATICCHECK_VERSION: v0.8.2
  GOVULNCHECK_VERSION: v1.9.0
  NFPM_VERSION: v2.47.0

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test -race
        if: matrix.os != 'windows-11-arm'
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: go test (windows/arm64 has no race detector)
        if: matrix.os == 'windows-11-arm'
        run: go test -count=1 ./...
      - name: staticcheck
        if: runner.os == 'Linux'
        run: go run honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} ./...
      - name: govulncheck
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: version from tag
        # VERSION goes unquoted into make recipes and into file names.
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH[-PRE]" >&2
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: build + package (amd64, arm64)
        run: |
          make package GOARCH=amd64 VERSION="${VERSION}"
          make package GOARCH=arm64 VERSION="${VERSION}"
      - name: build macOS and Windows (amd64, arm64)
        run: |
          for t in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            make build GOOS="${t%/*}" GOARCH="${t#*/}" VERSION="${VERSION}"
          done
      - name: archives
        # Commit time as mtime: two builds of one tag give identical archives.
        run: |
          mtime="@$(git log -1 --format=%ct)"
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${t%/*}"; arch="${t#*/}"; exe=""
            [ "$os" = windows ] && exe=".exe"
            d="hcdn-connector-${VERSION}-${os}-${arch}"
            mkdir "dist/$d"
            cp "dist/hcdn-connector-${os}-${arch}${exe}" "dist/$d/hcdn-connector${exe}"
            cp README.md LICENSE NOTICE packaging/config.example.yml "dist/$d/"
            mkdir "dist/$d/docs" && cp docs/standalone.md docs/protocol.md "dist/$d/docs/"
            [ "$os" = linux ] && cp packaging/hcdn-connector.service "dist/$d/"
            if [ "$os" = windows ]; then
              find "dist/$d" -exec touch -h -d "$mtime" {} +
              (cd dist && find "$d" | LC_ALL=C sort | TZ=UTC0 zip -X -q -@ "$d.zip")
            else
              tar -C dist --sort=name --owner=0 --group=0 --numeric-owner --mtime="$mtime" -cf - "$d" | gzip -n > "dist/$d.tar.gz"
            fi
            rm -r "dist/$d"
          done
      - name: SBOM (syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/hcdn-connector-${{ env.VERSION }}.spdx.json
          upload-artifact: false
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write # cosign keyless (Sigstore OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign artifacts (keyless)
        # Produces a Sigstore bundle (signature + certificate + tlog entry) per artifact; verification:
        #   cosign verify-blob --bundle <f>.sigstore.json \
        #     --certificate-identity-regexp '^https://github\.com/hostinger/hcdn-connector/\.github/workflows/release\.yml@refs/tags/v' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <f>
        run: |
          for f in dist/*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
      # - name: container image (needs REGISTRY_TOKEN + agreed image name)
      #   run: make docker VERSION=${VERSION} && docker push ...
